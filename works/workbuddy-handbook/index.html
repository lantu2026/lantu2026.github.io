<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师数字化手册 v1.2 · 基于 WorkBuddy</title>
<style>
:root{
  --ink:#111c2b; --ink2:#2b3c50; --muted:#6a7b8f; --line:#e3ecf6;
  --bg:#f2f6fb; --card:#ffffff;
  --brand:#1a6dff; --brand-d:#0d4fd1; --brand-l:#e8f1ff;
  --green:#00a97f; --green-l:#e6faf3;
  --amber:#e08c0b; --amber-l:#fff6e5;
  --red:#e0484d;
  --side:#0e1a2a; --side2:#16273c;
  --r:14px;
  --sh:0 1px 2px rgba(16,35,60,.05), 0 10px 28px rgba(16,35,60,.07);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky; top:0; z-index:50; height:60px;
  background:rgba(255,255,255,.88); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:18px; padding:0 22px;
}
.brand{display:flex; align-items:center; gap:11px; flex-shrink:0}
.brand .mark{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,#1a6dff,#00a97f);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 4px 12px rgba(26,109,255,.28);
}
.brand h1{font-size:15.5px;font-weight:700;letter-spacing:.2px;line-height:1.25}
.brand .sub{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.4px}
.searchbox{
  flex:1; max-width:520px; position:relative;
}
.searchbox input{
  width:100%; height:38px; border-radius:10px; border:1px solid var(--line);
  background:#f7fafd; padding:0 14px 0 38px; font-size:13.5px; color:var(--ink);
  outline:none; transition:.18s;
}
.searchbox input:focus{border-color:#9fc4ff;background:#fff;box-shadow:0 0 0 3px rgba(26,109,255,.09)}
.searchbox .ico{position:absolute;left:13px;top:9px;color:#9aabbd;font-size:15px}
.searchbox kbd{
  position:absolute;right:9px;top:9px;font-size:10.5px;color:#9aabbd;
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:#fff;
}
.topstat{margin-left:auto;display:flex;gap:16px;font-size:12px;color:var(--muted);flex-shrink:0}
.topstat b{color:var(--ink);font-weight:700;font-size:13px}

/* ============ 布局 ============ */
.shell{display:flex; align-items:flex-start; min-height:calc(100vh - 60px)}

/* ============ 侧栏 ============ */
.side{
  width:236px; flex-shrink:0; position:sticky; top:60px;
  height:calc(100vh - 60px); overflow-y:auto;
  background:var(--side); padding:18px 12px 40px;
}
.side::-webkit-scrollbar{width:5px}
.side::-webkit-scrollbar-thumb{background:#2c3f57;border-radius:3px}
.sgroup{margin-bottom:16px}
.sgroup .gt{
  font-size:13px; letter-spacing:1.2px; color:#7e97b5; font-weight:700;
  padding:4px 12px 7px; text-transform:uppercase;
  cursor:pointer; display:flex; align-items:center; user-select:none; border-radius:6px;
}
.sgroup .gt:hover{color:#9dbcdb}
.sgroup .gt .arw{margin-left:auto; font-size:9px; color:#4c6a8c; transition:.2s}
.sgroup.closed .gt .arw{transform:rotate(-90deg)}
.sgroup.closed .navitem{display:none}
.navitem{
  display:flex; align-items:center; gap:9px; padding:8px 12px; border-radius:8px;
  color:#b9cbe0; font-size:13.2px; transition:.15s; cursor:pointer; width:100%;
  text-align:left; line-height:1.4;
}
.navitem:hover{background:rgba(255,255,255,.06); color:#fff}
.navitem.on{background:linear-gradient(90deg,rgba(26,109,255,.32),rgba(26,109,255,.10)); color:#fff; font-weight:600}
.navitem.on .em{filter:drop-shadow(0 0 6px rgba(90,160,255,.7))}
.navitem .em{font-size:14.5px;width:18px;flex-shrink:0;text-align:center}
.navitem .cnt{margin-left:auto;font-size:10.5px;color:#6a86a6;background:rgba(255,255,255,.05);padding:1px 6px;border-radius:20px}
.menubtn{
  display:none; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:8px; border:1px solid var(--line);
  background:var(--card); cursor:pointer; font-size:16px; color:var(--ink2); flex-shrink:0;
}
.menubtn:hover{border-color:#bcd4f6}
.navitem .done{margin-left:auto;font-size:11px;color:#4fd6a8}

/* ============ 主区 ============ */
.main{flex:1; min-width:0; padding:26px 30px 70px; max-width:1180px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;gap:6px;align-items:center}
.crumb b{color:var(--ink2);font-weight:600}

/* 首页 hero */
.hero{
  background:linear-gradient(135deg,#0f2547 0%,#123a63 55%,#0d5a52 100%);
  border-radius:18px; padding:34px 36px 30px; color:#fff; position:relative; overflow:hidden;
  box-shadow:0 14px 40px rgba(13,38,70,.22);
  display:flex; align-items:center; gap:34px;
}
.hero .hl{flex:1; min-width:0; position:relative}
.hero::after{
  content:""; position:absolute; right:-70px; top:-90px; width:320px; height:320px;
  background:radial-gradient(circle,rgba(0,220,170,.22),transparent 62%);
  pointer-events:none;
}
.hero::before{
  content:""; position:absolute; left:-40px; bottom:-110px; width:280px; height:280px;
  background:radial-gradient(circle,rgba(60,140,255,.20),transparent 65%);
  pointer-events:none;
}
.hero .tag{
  display:inline-block; font-size:11.5px; letter-spacing:1.2px;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.2);
  padding:4px 12px; border-radius:20px; margin-bottom:14px; position:relative;
}
.hero h2{font-size:26px; font-weight:800; line-height:1.45; letter-spacing:.4px; position:relative; max-width:720px}
.hero h2 em{font-style:normal;color:#5ff0c4}
.hero p{margin-top:11px;font-size:14px;color:#c3d7ec;max-width:660px;position:relative;line-height:1.75}
.hero .nums{display:flex;gap:34px;margin-top:22px;position:relative}
.hero .nums div{font-size:12px;color:#8fb0d0}
.hero .nums b{display:block;font-size:24px;color:#fff;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.hero .nums b span{font-size:13px;font-weight:500;color:#8fb0d0;margin-left:2px}
.hero .hq{
  flex-shrink:0; width:268px; position:relative;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.17);
  border-radius:14px; padding:17px 16px 12px; backdrop-filter:blur(4px);
}
.hero .hq .hqt{font-size:13px;font-weight:700;letter-spacing:.4px}
.hero .hq .hqs{font-size:11px;color:#a9c4de;margin:3px 0 12px}
.hero .hq button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.13);
  border-radius:9px; padding:9px 12px; margin-bottom:7px; color:#eaf3fd;
  font-size:12.8px; cursor:pointer; transition:.15s;
}
.hero .hq button:hover{background:rgba(255,255,255,.22); transform:translateX(3px)}
.hero .hq button .em{font-size:14px}
.hero .hq button .go{margin-left:auto;font-size:11.5px;color:#7ee8c4;opacity:0;transition:.15s}
.hero .hq button:hover .go{opacity:1}

/* 区块标题 */
.sect{display:flex;align-items:baseline;gap:12px;margin:30px 0 15px}
.sect h3{font-size:16.5px;font-weight:700;letter-spacing:.3px}
.sect .hint{font-size:12.5px;color:var(--muted)}

/* 场景卡 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:17px 18px 15px; cursor:pointer; transition:.2s; position:relative;
  box-shadow:0 1px 2px rgba(16,35,60,.03);
}
.card:hover{transform:translateY(-3px);border-color:#bcd4f6;box-shadow:var(--sh)}
.card .ci{font-size:20px;line-height:1;margin-bottom:9px;display:block}
.card h4{font-size:15px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.card .pain{font-size:12.8px;color:var(--muted);line-height:1.6;min-height:42px}
.card .meta{
  display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;
  border-top:1px dashed var(--line);font-size:11.5px;color:#8fa2b6;
}
.card .meta .n{color:var(--brand);font-weight:600}
.card .ok{position:absolute;top:14px;right:14px;font-size:11px;color:var(--green);opacity:0;transition:.2s}
.card.done .ok{opacity:1}

/* ============ 场景页 ============ */
.scene-head{margin-bottom:22px}
.scene-head .gp{
  display:inline-block;font-size:11px;letter-spacing:1px;color:var(--brand);
  background:var(--brand-l);padding:3px 10px;border-radius:5px;margin-bottom:11px;font-weight:600;
}
.scene-head h2{font-size:27px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:12px}
.scene-head .pain{
  margin-top:10px;font-size:15.5px;color:var(--ink2);line-height:1.75;
  border-left:3px solid #cfe0f7;padding-left:14px;max-width:820px;
}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 6px}
.fact{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.fact .k{font-size:11px;color:var(--muted);letter-spacing:.8px;margin-bottom:4px}
.fact .v{font-size:13.8px;font-weight:600;line-height:1.55;color:var(--ink2)}
.fact.good .v{color:#0a8a68}

.cmdwrap{margin-top:22px}
.cmd{
  background:#0e1a2a; border-radius:12px; overflow:hidden; margin-bottom:13px;
  box-shadow:0 6px 18px rgba(12,26,45,.13);
}
.cmd-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 15px; background:rgba(255,255,255,.045);
  border-bottom:1px solid rgba(255,255,255,.07);
}
.cmd-t{color:#8fb4d8;font-size:12.5px;font-weight:600;letter-spacing:.4px;display:flex;align-items:center;gap:7px}
.cmd-t .idx{
  background:rgba(95,240,196,.16);color:#5ff0c4;font-size:10.5px;font-weight:700;
  padding:1px 6px;border-radius:4px;letter-spacing:0;
}
.copy{
  color:#8fb4d8;font-size:11.5px;border:1px solid rgba(255,255,255,.18);
  padding:4px 11px;border-radius:6px;transition:.16s;flex-shrink:0;
}
.copy:hover{background:rgba(95,240,196,.14);border-color:rgba(95,240,196,.5);color:#5ff0c4}
.copy.ok{background:#0d8f6b;border-color:#0d8f6b;color:#fff}
.cmd-b{
  padding:15px 17px; color:#dbe8f6; font-size:14px; line-height:1.9;
  white-space:pre-wrap; word-break:break-word; font-family:inherit; margin:0;
}

.casebox{
  margin-top:24px;background:linear-gradient(135deg,#f0fbf6,#eef7ff);
  border:1px solid #cbebdd;border-radius:13px;padding:17px 19px;
}
.casebox .ct{font-size:12px;font-weight:700;color:#0a8a68;letter-spacing:.9px;margin-bottom:7px}
.casebox p{font-size:13.8px;color:#23443c;line-height:1.8}

.manual{margin-top:18px;font-size:12px;color:#93a5b8;display:flex;align-items:center;gap:8px}
.manual b{color:#6a8099;font-weight:600}

.pager{display:flex;justify-content:space-between;margin-top:34px;padding-top:18px;border-top:1px solid var(--line);gap:12px}
.pager button{
  font-size:13px;color:var(--ink2);border:1px solid var(--line);background:#fff;
  padding:9px 15px;border-radius:9px;transition:.16s;max-width:48%;text-align:left;
}
.pager button:hover{border-color:#bcd4f6;background:#f7fbff}
.pager .nx{margin-left:auto;text-align:right}

/* 案例库 */
.casecard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:19px 21px;margin-bottom:13px;transition:.2s}
.casecard:hover{border-color:#bcd4f6;box-shadow:var(--sh)}
.casecard .ch{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.casecard h4{font-size:16px;font-weight:700}
.casecard .badge{font-size:10.5px;padding:2px 8px;border-radius:5px;background:var(--brand-l);color:var(--brand);font-weight:600}
.casecard .desc{font-size:13.6px;color:var(--ink2);line-height:1.8}
.casecard .res{display:flex;gap:22px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.casecard .res b{color:#0a8a68;font-weight:700}

/* 路径页 */
.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:linear-gradient(#1a6dff,#00a97f)}
.tli{position:relative;margin-bottom:20px}
.tli::before{
  content:"";position:absolute;left:-26px;top:5px;width:12px;height:12px;border-radius:50%;
  background:#fff;border:3px solid var(--brand);
}
.tli .day{font-size:11.5px;font-weight:700;color:var(--brand);letter-spacing:1px}
.tli h4{font-size:15.5px;font-weight:700;margin:2px 0 5px}
.tli p{font-size:13.5px;color:var(--ink2);line-height:1.78}
.tli .q{
  margin-top:8px;background:#0e1a2a;color:#dbe8f6;border-radius:9px;
  padding:11px 14px;font-size:13px;line-height:1.8;white-space:pre-wrap;position:relative;
}

.notebox{background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:11px;padding:15px 18px;margin-bottom:12px}
.notebox h4{font-size:14.5px;font-weight:700;margin-bottom:5px}
.notebox p{font-size:13.4px;color:var(--ink2);line-height:1.78}

/* 搜索结果 */
.sres{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 17px;margin-bottom:10px;cursor:pointer;transition:.16s}
.sres:hover{border-color:#bcd4f6;background:#fbfdff}
.sres .st{font-size:14.5px;font-weight:700;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.sres .sn{font-size:12.5px;color:var(--muted);line-height:1.6}
.sres mark{background:#fff2c2;color:inherit;padding:0 2px;border-radius:2px}

.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
.empty .big{font-size:36px;display:block;margin-bottom:12px;opacity:.5}

@media(max-width:900px){
  .menubtn{display:flex}
  .side{
    position:fixed; left:0; top:60px; bottom:0; z-index:60; width:248px;
    transform:translateX(-102%); transition:transform .25s ease;
    box-shadow:8px 0 30px rgba(10,25,50,.35);
  }
  .side.open{transform:none}
  .scrim{display:none; position:fixed; inset:0; background:rgba(10,22,40,.45); z-index:55}
  .scrim.on{display:block}
  .main{padding:20px 16px 60px}
  .hero{padding:26px 22px; flex-direction:column; align-items:stretch; gap:20px}
  .hero .hq{width:auto}
  .hero h2{font-size:21px}
  .facts{grid-template-columns:1fr}
  .topstat{display:none}
  .searchbox{max-width:none}
}
@media print{
  .side,.topbar,.pager,.copy{display:none}
  .main{padding:0;max-width:none}
  .cmd{break-inside:avoid}
}

/* ============ 界面风格主题 ============ */
html[data-theme="dawn"]{
  --side:#f2f6fb; --side2:#e7eef7; --bg:#eef3f9;
}
html[data-theme="dawn"] .side{border-right:1px solid var(--line)}
html[data-theme="dawn"] .side::-webkit-scrollbar-thumb{background:#c7d6e8}
html[data-theme="dawn"] .sgroup .gt{color:#7c92ab}
html[data-theme="dawn"] .sgroup .gt:hover{color:#4a688c}
html[data-theme="dawn"] .sgroup .gt .arw{color:#a8bcd2}
html[data-theme="dawn"] .navitem{color:#42566d}
html[data-theme="dawn"] .navitem:hover{background:rgba(26,109,255,.08); color:var(--ink)}
html[data-theme="dawn"] .navitem.on{background:linear-gradient(90deg,rgba(26,109,255,.16),rgba(26,109,255,.05)); color:var(--brand-d)}
html[data-theme="dawn"] .navitem.on .em{filter:none}
html[data-theme="dawn"] .navitem .cnt{color:#8ba0b6;background:rgba(16,35,60,.06)}
html[data-theme="dawn"] .hero{background:linear-gradient(135deg,#e8f1ff 0%,#dcebff 55%,#e0f5ef 100%); box-shadow:0 14px 40px rgba(26,109,255,.12)}
html[data-theme="dawn"] .hero h2{color:var(--ink2)}
html[data-theme="dawn"] .hero h2 em{color:var(--brand-d)}
html[data-theme="dawn"] .hero p{color:#51678a}
html[data-theme="dawn"] .hero .tag{background:rgba(26,109,255,.1);border-color:rgba(26,109,255,.28);color:var(--brand-d)}
html[data-theme="dawn"] .hero .nums div{color:#6a83a8}
html[data-theme="dawn"] .hero .nums b{color:var(--ink2)}
html[data-theme="dawn"] .hero .nums b span{color:#6a83a8}
html[data-theme="dawn"] .hero .hq{background:rgba(255,255,255,.78);border-color:rgba(26,109,255,.18)}
html[data-theme="dawn"] .hero .hq .hqt{color:var(--ink2)}
html[data-theme="dawn"] .hero .hq .hqs{color:#6a83a8}
html[data-theme="dawn"] .hero .hq button{background:rgba(255,255,255,.92);border-color:rgba(26,109,255,.16);color:var(--ink2)}
html[data-theme="dawn"] .hero .hq button:hover{background:#fff}
html[data-theme="dawn"] .hero .hq button .go{color:var(--brand)}
html[data-theme="dawn"] .hero::after{background:radial-gradient(circle,rgba(0,169,127,.15),transparent 62%)}
html[data-theme="dawn"] .hero::before{background:radial-gradient(circle,rgba(26,109,255,.12),transparent 65%)}
html[data-theme="sand"]{
  --bg:#f6f1e7; --line:#e8dfcc; --card:#fffdf8;
  --brand:#0e8a6d; --brand-d:#0a6a53; --brand-l:#e4f3ee;
  --side:#262b20; --side2:#323827;
}
html[data-theme="sand"] .brand .mark{background:linear-gradient(135deg,#0e8a6d,#b98a2f); box-shadow:0 4px 12px rgba(14,138,109,.28)}
html[data-theme="sand"] .navitem.on{background:linear-gradient(90deg,rgba(14,138,109,.38),rgba(14,138,109,.10))}
html[data-theme="sand"] .navitem.on .em{filter:drop-shadow(0 0 6px rgba(80,200,160,.7))}
html[data-theme="sand"] .hero{background:linear-gradient(135deg,#2e2a1c 0%,#4a4326 55%,#1f4a38 100%); box-shadow:0 14px 40px rgba(60,50,20,.25)}
html[data-theme="sand"] .hero h2 em{color:#a8e6c1}
html[data-theme="sand"] .hero .hq button .go{color:#a8e6c1}
html[data-theme="sand"] .hero::after{background:radial-gradient(circle,rgba(185,138,47,.25),transparent 62%)}
html[data-theme="sand"] .hero::before{background:radial-gradient(circle,rgba(14,138,109,.25),transparent 65%)}
html[data-theme="sand"] .searchbox input:focus{border-color:#8fc7b5;box-shadow:0 0 0 3px rgba(14,138,109,.1)}

/* 图解场景组件 */
.viz{margin-top:22px}
.viz-h{font-size:16px;font-weight:700;margin:4px 0 12px;color:var(--ink2)}
.viz .fig{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.viz .fig svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:12.8px;color:var(--ink2)}
.legend b{color:var(--brand)}
.dlrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.dlbtn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:10px;box-shadow:0 6px 16px rgba(26,109,255,.22);transition:.15s}
.dlbtn:hover{background:var(--brand-d);transform:translateY(-2px)}
.dltag{font-size:12px;color:var(--ink2);border:1px solid var(--line);background:var(--card);padding:5px 11px;border-radius:20px}
.faq3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
.faq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.faq b{display:block;font-size:13.5px;margin-bottom:5px;color:var(--ink2)}
.faq p{font-size:12.8px;color:var(--muted);line-height:1.7}
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:6px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.mcard .mi{font-size:22px}
.mcard h4{font-size:15px;margin:6px 0 4px;color:var(--ink2)}
.mcard .ms{font-size:11.5px;color:#fff;display:inline-block;padding:1px 9px;border-radius:12px;margin-bottom:8px}
.mcard ul{list-style:none;margin-top:4px}
.mcard li{font-size:12.8px;color:var(--ink2);line-height:1.85;padding-left:15px;position:relative}
.mcard li::before{content:"·";position:absolute;left:2px;color:var(--brand);font-weight:800}
.motto{margin-top:14px;background:linear-gradient(90deg,var(--brand-l),var(--green-l));border:1px solid var(--line);border-radius:12px;padding:13px 18px;font-size:14px;font-weight:700;color:var(--ink2);text-align:center;letter-spacing:.5px}
.themebtn{
  display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;flex-shrink:0;
  border-radius:9px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;color:var(--ink2);transition:.15s;
}
.themebtn:hover{border-color:#bcd4f6}
</style>
</head>

let themeIdx = THEMES.findIndex(t => t.id === (localStorage.getItem('wb_manual_theme') || ''));
if (themeIdx < 0) themeIdx = 0;
function applyTheme() {
  const t = THEMES[themeIdx];
  if (t.id) document.documentElement.dataset.theme = t.id;
  else delete document.documentElement.dataset.theme;
  $('#themeName').textContent = t.name;
  localStorage.setItem('wb_manual_theme', t.id);
}
$('#themebtn').addEventListener('click', () => { themeIdx = (themeIdx + 1) % THEMES.length; applyTheme(); });

let route = 'home';

let DONE = new Set();
try { DONE = new Set(JSON.parse(localStorage.getItem('wb_done') || '[]')); } catch (e) {}

const TOTAL_CMDS = SCENES.reduce((a, s) => a + s.cmds.length, 0);

function saveDone() {
  try { localStorage.setItem('wb_done', JSON.stringify([...DONE])); } catch (e) {}
  updateStats();
}

function updateStats() {
  $('#scNum').textContent = SCENES.length;
  $('#cmNum').textContent = TOTAL_CMDS;
  $('#okNum').textContent = DONE.size;
}

function go(r, id) {
  route = r; cur = id || '';
  keyword = ''; qInput.value = '';
  toggleSide(false);
  location.hash = r + (id ? '/' + id : '');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  renderSide();
  if (keyword) { renderSearch(); return; }
  if (route === 'scene') renderScene(cur);
  else if (route === 'cases') renderCases();
  else if (route === 'path') renderPath();
  else renderHome();
}

function renderScene(id) {
  const s = SCENES.find(x => x.id === id);
  if (!s) { renderHome(); return; }
  const g = GROUPS.find(x => x.id === s.g);
  const idx = SCENES.indexOf(s);
  const prev = SCENES[idx - 1], next = SCENES[idx + 1];
  const done = DONE.has(s.id);

  let h = `
  <div class="crumb"><span data-nav="home" style="cursor:pointer">总览</span> / <b>${g.name}</b> / <b>${s.name}</b></div>
  <div class="scene-head">
    <span class="gp">${g.icon} ${g.name}</span>
    <h2>${s.icon} ${s.name}</h2>
    <div class="pain">${s.pain}</div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">用它之后</div><div class="v good">${s.gain}</div></div>
    <div class="fact"><div class="k">你能拿到</div><div class="v">${s.deliv.join(' · ')}</div></div>
    <div class="fact"><div class="k">我的状态</div><div class="v">
      <button class="copy" style="color:#1a6dff;border-color:#bcd4f6;background:#fff" data-try="${s.id}">
      ${done ? '✓ 已试过，再试一次' : '标记为已试过'}</button></div></div>
  </div>`;

  if (s.visual) h += s.visual;
  if (s.cmds.length) {
    h += `<div class="cmdwrap">`;
    s.cmds.forEach((c, i) => {
      h += `<div class="cmd">
        <div class="cmd-h">
          <span class="cmd-t"><span class="idx">${String(i + 1).padStart(2, '0')}</span>${c.t}</span>
          <button class="copy" data-cp="${s.id}" data-i="${i}">复制</button>
        </div>
        <pre class="cmd-b">${esc(c.c)}</pre>
      </div>`;
    });
    h += `</div>`;
  }

  if (s.case) {
    h += `<div class="casebox"><div class="ct">🏫 本校怎么用的</div><p>${s.case.d}</p></div>`;
  }

  h += `<div class="manual"><b>对应手册</b>：${s.manual}${s.cmds.length ? ' · 指令已按小学学段改写，替换学科年级即可' : ' · 照着示意图点，直接出结果'}</div>`;

  h += `<div class="pager">
    ${prev ? `<button data-nav="scene" data-id="${prev.id}">← ${prev.name}</button>` : '<span></span>'}
    ${next ? `<button class="nx" data-nav="scene" data-id="${next.id}">${next.name} →</button>` : '<span></span>'}
  </div>`;

  main.innerHTML = h;
}

function renderCases() {
  let h = `<div class="crumb"><span data-nav="home" style="cursor:pointer">总览</span> / <b>本校案例库</b></div>

function renderPath() {
  let h = `<div class="crumb"><span data-nav="home" style="cursor:pointer">总览</span> / <b>7 天上手</b></div>
  <div class="scene-head">
    <span class="gp">🚀 上手路径</span>

function renderSearch() {
  const k = keyword.toLowerCase();
  const hitS = SCENES.filter(s =>
    s.name.toLowerCase().includes(k) || s.pain.toLowerCase().includes(k) ||
    s.deliv.join('').toLowerCase().includes(k) ||
    s.cmds.some(c => c.t.toLowerCase().includes(k) || c.c.toLowerCase().includes(k))
  );
  let h = `<div class="crumb"><span data-nav="home" style="cursor:pointer">总览</span> / <b>搜索“${esc(keyword)}”</b></div>
  <div class="sect"><h3>找到 ${hitS.length} 个相关场景</h3></div>`;
  if (!hitS.length) {
    h += `<div class="empty"><span class="big">🔍</span>没找到。<br>换个说法试试，比如“评语”“出卷”“错题”“值日”“学件”。</div>`;
  } else {
    hitS.forEach(s => {
      const hitCmd = s.cmds.filter(c => c.c.toLowerCase().includes(k) || c.t.toLowerCase().includes(k));
      h += `<div class="sres" data-nav="scene" data-id="${s.id}">
        <div class="st"><span>${s.icon}</span>${hl(s.name, k)}</div>
        <div class="sn">${hl(s.pain, k)}</div>
        ${hitCmd.length ? `<div class="sn" style="margin-top:4px;color:#1a6dff">命中指令：${hitCmd.map(c => hl(c.t, k)).join('、')}</div>` : ''}
      </div>`;
    });
  }
  main.innerHTML = h;
}

function esc(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function hl(t, k) {
  const e = esc(t);
  if (!k) return e;
  const re = new RegExp('(' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return e.replace(re, '<mark>$1</mark>');
}

/* ---------- 复制 ---------- */
function copyText(txt, btn) {
  const ok = () => {
    const old = btn.textContent;
    btn.textContent = '已复制 ✓';
    btn.classList.add('ok');
    setTimeout(() => { btn.textContent = old; btn.classList.remove('ok'); }, 1600);
  };
  const fb = () => {
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); ok(); }
    catch (e) { alert('复制失败，请手动选中文字复制'); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(ok).catch(fb);
  } else { fb(); }
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const tg = e.target.closest('[data-tg]');
  if (tg) {
    const gid = tg.dataset.tg;
    const grp = tg.closest('.sgroup');
    grp.classList.toggle('closed');
    if (grp.classList.contains('closed')) FOLD.add(gid); else FOLD.delete(gid);
    saveFold();
    return;
  }

  const nav = e.target.closest('[data-nav]');
  if (nav) { go(nav.dataset.nav, nav.dataset.id); return; }

  const cp = e.target.closest('[data-cp]');
  if (cp) {
    const s = SCENES.find(x => x.id === cp.dataset.cp);
    copyText(s.cmds[+cp.dataset.i].c, cp);
    return;
  }

  const tryBtn = e.target.closest('[data-try]');
  if (tryBtn) {
    const id = tryBtn.dataset.try;
    if (DONE.has(id)) DONE.delete(id); else DONE.add(id);
    saveDone(); renderScene(id);
    return;
  }
});

qInput.addEventListener('input', e => {
  keyword = e.target.value.trim();
  if (keyword) { renderSearch(); }
  else { render(); }
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qInput) {
    e.preventDefault(); qInput.focus(); qInput.select();
  }
  if (e.key === 'Escape' && document.activeElement === qInput) {
    qInput.value = ''; keyword = ''; qInput.blur(); render();
  }
});

/* ---------- 启动 ---------- */
(function init() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  if (h.startsWith('scene/')) { route = 'scene'; cur = h.split('/')[1]; }
  else if (h === 'cases' || h === 'path' || h === 'home') { route = h === 'home' ? 'home' : h; }
  updateStats();
  render();
})();
