<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>虚拟工坊 - 组装台灯与吊灯 | 互动学件</title>
    <style>
        /* --- 科技工坊主题变量 (与原版完全一致) --- */
        :root {
            --bg-page: #0b1120;
            --bg-panel: #1e293b;     
            --bg-grid: #1e293b;      
            --bg-slot: #334155;      
            --text-main: #ffffff;    
            --text-sub: #94a3b8;     
            --text-accent: #38bdf8;  /* 科技蓝 */
            --text-warn: #f472b6;    
            --border-main: #475569;
            --border-glow: #38bdf8;
            --neon-panel: 0 0 15px rgba(56, 189, 248, 0.15), inset 0 0 20px rgba(56, 189, 248, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-page);
            background-image: 
                linear-gradient(rgba(30, 41, 59, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 41, 59, 0.5) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main);
            overflow: hidden;
        }

        /* --- 顶部状态栏 --- */
        .top-bar {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background-color: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid var(--border-main);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 50;
            flex-shrink: 0;
        }

        .brand {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-accent);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
            cursor: pointer;
        }

        .status-display {
            background: #0f172a;
            border: 2px solid var(--border-main);
            padding: 8px 30px;
            border-radius: 50px;
            font-size: 1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 300px;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.3s;
            white-space: nowrap;
        }
        .status-display.success { 
            color: #4ade80; 
            border-color: #22c55e; 
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
        }
        .status-display.error { 
            color: #f472b6; 
            border-color: #ec4899; 
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
        }

        .btn-reset {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 8px 20px;
            background-color: var(--bg-slot);
            color: var(--text-main);
            border: 2px solid var(--text-accent);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
            flex-shrink: 0;
        }
        .btn-reset:hover { 
            background-color: var(--text-accent); 
            color: #0b1120;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            transform: scale(1.05);
        }

        /* --- 主体布局 --- */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 20px;
            gap: 20px;
        }

        .panel {
            background-color: rgba(30, 41, 59, 0.6);
            border: 2px solid var(--border-main);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            box-shadow: var(--neon-panel);
        }

        .panel-left, .panel-right { flex: 1; min-width: 0; }
        .panel-center { flex: 1.2; background-color: rgba(15, 23, 42, 0.8); min-width: 0; }

        .panel.drag-over {
            border-color: var(--text-accent);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4), inset 0 0 20px rgba(56, 189, 248, 0.2);
        }

        /* --- 遮罩层与锁定状态 --- */
        .panel-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            transition: opacity 0.5s ease, visibility 0.5s;
            backdrop-filter: blur(5px);
        }

        .panel-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .btn-start {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #0b1120;
            background: var(--text-accent);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            transition: transform 0.2s;
        }
        .btn-start:hover { transform: scale(1.1); background: #fff; }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 2px solid var(--border-main);
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px 14px 0 0;
            flex-shrink: 0;
        }
        .panel-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-accent);
            margin: 0;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }
        .panel-subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-top: 8px;
            line-height: 1.6;
        }
        .required-list b {
            color: #fff;
            background: rgba(56, 189, 248, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
            margin: 0 4px 4px 0;
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: inline-block;
            font-weight: normal;
            font-size: 0.85rem;
        }

        .workspace {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }
        .workspace.pendant { align-items: flex-start; }

        .assembly-svg {
            width: 100%;
            height: 100%;
            max-width: 400px;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.1));
        }

        .svg-part { transition: opacity 0.4s ease; opacity: 0; pointer-events: none; }
        .svg-part.visible { opacity: 1; pointer-events: auto; }
        .interactive-zone { cursor: pointer; fill: transparent; transition: all 0.2s; }
        .interactive-zone:hover { stroke: var(--text-accent); stroke-width: 2px; }
        .switch-knob { transition: transform 0.2s, fill 0.2s; stroke: #fff; stroke-width: 1px; }
        .switch-active .switch-knob { fill: #4ade80; filter: drop-shadow(0 0 10px #4ade80); stroke: #22c55e; }
        .light-beam { opacity: 0; transition: opacity 0.5s; mix-blend-mode: screen; pointer-events: none; }
        .light-beam.on { opacity: 0.9; }
        .bulb-filament { transition: stroke 0.3s; stroke: #444; }
        .bulb-glass { transition: fill 0.3s; fill: rgba(255,255,255,0.1); }
        .lit .bulb-filament { stroke: #fff; stroke-width: 3; filter: drop-shadow(0 0 4px #fff); }
        .lit .bulb-glass { fill: url(#glowGradient); stroke: #fff; filter: drop-shadow(0 0 15px rgba(252, 211, 77, 0.9)); }

        .parts-container { flex: 1; padding: 16px; overflow: hidden; }
        .parts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px 12px;
            height: 100%;
            width: 100%;
        }
        .part-card {
            background: var(--bg-slot);
            border: 1px solid var(--border-main);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: all 0.2s;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            height: 100%;
            min-height: 0;
        }
        .part-card:hover {
            border-color: var(--text-accent);
            background: #334155;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3), 0 0 10px rgba(56, 189, 248, 0.4);
        }
        .part-card:active { cursor: grabbing; transform: scale(0.98); }
        .part-icon {
            width: 100%;
            height: 65%;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            pointer-events: none;
        }
        .part-name {
            margin-top: 4px;
            font-size: 1rem;
            color: #e2e8f0;
            font-weight: 500;
            text-align: center;
            pointer-events: none;
        }

        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 80px;
            height: 80px;
            opacity: 0.8;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 10px var(--text-accent));
        }
        .progress-bar {
            padding: 16px;
            background: rgba(0,0,0,0.4);
            border-top: 2px solid var(--border-main);
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .progress-step {
            width: 30px;
            height: 6px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .progress-step.active {
            background: var(--text-accent);
            border-color: #fff;
            box-shadow: 0 0 10px var(--text-accent);
        }
        .placeholder-hint {
            position: absolute;
            color: var(--text-accent);
            font-weight: bold;
            font-size: 0.9rem;
            opacity: 0.7;
            border: 2px dashed var(--text-accent);
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(56, 189, 248, 0.1);
            pointer-events: none;
            z-index: 20;
        }
        .placeholder-hint.desk { bottom: 60px; }
        .placeholder-hint.pendant { top: 60px; }
        .locked-msg { color: var(--text-sub); font-size: 1.1rem; text-align: center; }
    </style>
</head>
<body>
<header class="top-bar">
    <div class="brand" onclick="toggleFullscreen()">⚡ 虚拟工坊 - 自由闯关版</div>
    <div id="status-display" class="status-display">请选择一个实验开始！</div>
    <button onclick="resetWorkshop()" class="btn-reset">⟳ 重置</button>
</header>

<main class="main-layout">
    <!-- 左侧：台灯 -->
    <section id="zone-desk" class="panel panel-left" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'desk')">
        <div id="overlay-desk" class="panel-overlay"><button class="btn-start" onclick="selectExperiment('desk')">开始制作台灯</button></div>
        <div class="panel-header"><h2 class="panel-title">💡 制作台灯</h2><div class="panel-subtitle required-list"><b>底座</b><b>支架</b><b>灯泡</b><b>灯罩</b><b>插头</b><b>开关</b></div></div>
        <div class="workspace desk">
            <div id="desk-hint" class="placeholder-hint desk">拖动底座放在这里</div>
            <svg class="assembly-svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMax">
                <defs><radialGradient id="glowGradient" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#fff" stop-opacity="0.9"/><stop offset="60%" stop-color="#fcd34d" stop-opacity="0.5"/><stop offset="100%" stop-color="rgba(252,211,77,0)"/></radialGradient><linearGradient id="lightConeGrad" x1="0.5" y1="0" x2="0.5" y2="1"><stop offset="0%" stop-color="rgba(255,253,208,0.5)"/><stop offset="100%" stop-color="rgba(255,253,208,0)"/></linearGradient><filter id="softLight"><feGaussianBlur in="SourceGraphic" stdDeviation="12"/></filter><linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#334155"/><stop offset="50%" stop-color="#64748b"/><stop offset="100%" stop-color="#334155"/></linearGradient><linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0284c7"/><stop offset="50%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient></defs>
                <g id="desk-beam" class="light-beam"><path d="M210 230 L270 230 L400 480 L80 480 Z" fill="url(#lightConeGrad)" filter="url(#softLight)"/><ellipse cx="240" cy="480" rx="160" ry="25" fill="#fcd34d" opacity="0.4" filter="url(#softLight)"/></g>
                <g id="svg-desk-wire" class="svg-part"><path d="M260 480 Q320 480 340 450 T380 480" fill="none" stroke="#60a5fa" stroke-width="4"/><path d="M380 470 h15 v20 h-15 z" fill="#1e293b"/><rect x="395" y="474" width="8" height="3" fill="#94a3b8"/><rect x="395" y="483" width="8" height="3" fill="#94a3b8"/></g>
                <g id="svg-desk-base" class="svg-part"><path d="M140 470 v10 q0 10 60 10 q60 0 60 -10 v-10" fill="url(#metalGrad)"/><ellipse cx="200" cy="470" rx="60" ry="15" fill="#475569"/><rect x="175" y="458" width="50" height="20" rx="2" fill="#0f172a"/></g>
                <g id="svg-desk-stand" class="svg-part"><path d="M200 450 L180 300" stroke="url(#metalGrad)" stroke-width="12" stroke-linecap="round"/><circle cx="180" cy="300" r="10" fill="#475569"/><path d="M180 300 L240 160" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round"/><circle cx="240" cy="160" r="8" fill="#475569"/></g>
                <g id="svg-desk-bulb" class="svg-part"><g transform="translate(240, 180)"><rect x="-10" y="0" width="20" height="15" fill="#eab308"/><path class="bulb-glass" d="M-15 15 C-15 30 -10 50 0 60 C10 50 15 30 15 15 Z"/><path class="bulb-filament" d="M-5 25 q5 10 10 0" fill="none"/></g></g>
                <g id="svg-desk-shade" class="svg-part"><g transform="translate(240, 160)"><rect x="-5" y="-5" width="10" height="20" fill="#475569"/><path d="M-25 15 L-75 75 Q0 85 75 75 L25 15 Z" fill="url(#blueGrad)"/><ellipse cx="0" cy="75" rx="75" ry="10" fill="#1e293b" opacity="0.3"/></g></g>
                <g id="svg-desk-switch" class="svg-part" onclick="handleSwitchClick('desk')"><rect x="180" y="460" width="40" height="16" rx="4" fill="#334155" stroke="#fff" class="interactive-zone"/><circle class="switch-knob" cx="200" cy="468" r="6" fill="#ef4444" stroke="#fff" stroke-width="2"/></g>
            </svg>
        </div>
        <div id="progress-desk" class="progress-bar"></div>
    </section>

    <!-- 中央仓库 -->
    <section class="panel panel-center">
        <div class="panel-header"><h2 class="panel-title" style="text-align:center;">零件仓库</h2><div class="panel-subtitle" style="text-align:center;">一次只能进行一个实验，完成后自动解锁另一个！</div></div>
        <div id="inventory-grid" class="parts-container"><div class="parts-grid" id="parts-grid-content"></div></div>
    </section>

    <!-- 右侧：吊灯 -->
    <section id="zone-pendant" class="panel panel-right" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'pendant')">
        <div id="overlay-pendant" class="panel-overlay"><button class="btn-start" onclick="selectExperiment('pendant')">开始制作吊灯</button></div>
        <div class="panel-header"><h2 class="panel-title" style="justify-content:flex-end;">✨ 制作吊灯</h2><div class="panel-subtitle required-list"><b>顶部灯座</b><b>电线</b><b>灯泡</b><b>灯罩</b><b>墙上开关</b></div></div>
        <div class="workspace pendant">
            <div id="pendant-hint" class="placeholder-hint pendant">拖动顶部灯座放在这里</div>
            <svg class="assembly-svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMin">
                <defs><linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ea580c"/><stop offset="50%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient></defs>
                <g id="pendant-beam" class="light-beam"><path d="M160 210 L240 210 L380 500 L20 500 Z" fill="url(#lightConeGrad)" filter="url(#softLight)"/><ellipse cx="200" cy="500" rx="180" ry="30" fill="#fcd34d" opacity="0.4" filter="url(#softLight)"/></g>
                <g id="svg-pendant-power" class="svg-part"><rect x="160" y="0" width="80" height="30" fill="#334155"/><path d="M160 30 L170 35 H230 L240 30" fill="#1e293b"/><circle cx="200" cy="15" r="4" fill="#38bdf8" filter="drop-shadow(0 0 5px #38bdf8)"/></g>
                <g id="svg-pendant-wire-conduit" class="svg-part"><path d="M240 15 H340 V300" stroke="#334155" stroke-width="2" stroke-dasharray="5,5" fill="none" opacity="0.5"/></g>
                <g id="svg-pendant-cord" class="svg-part"><line x1="200" y1="30" x2="200" y2="150" stroke="#1e293b" stroke-width="4"/><path d="M198 30 l4 10 M198 50 l4 10 M198 70 l4 10 M198 90 l4 10 M198 110 l4 10 M198 130 l4 10" stroke="#475569"/></g>
                <g transform="translate(200,150)">
                    <g id="svg-pendant-bulb" class="svg-part"><g transform="translate(0,30)"><path class="bulb-glass" d="M-15 0 C-15 15 -10 40 0 50 C10 40 15 15 15 0 Z"/><path class="bulb-filament" d="M-5 10 L5 10 M0 10 L0 30"/></g></g>
                    <g id="svg-pendant-shade" class="svg-part"><rect x="-15" y="0" width="30" height="30" fill="#334155"/><path d="M-15 15 L-80 60 Q0 70 80 60 L15 15 Z" fill="url(#orangeGrad)"/><ellipse cx="0" cy="60" rx="80" ry="10" fill="#fdba74" opacity="0.2"/></g>
                </g>
                <g id="svg-pendant-switch" class="svg-part" onclick="handleSwitchClick('pendant')" transform="translate(320,300)"><rect x="-20" y="-30" width="40" height="60" rx="2" fill="#cbd5e1" class="interactive-zone"/><rect x="-10" y="-15" width="20" height="30" fill="#94a3b8"/><rect class="switch-knob" x="-10" y="-15" width="20" height="15" fill="#f87171" stroke="#fff"/></g>
            </svg>
        </div>
        <div id="progress-pendant" class="progress-bar"></div>
    </section>
</main>

<script>
    // ---------- 零部件 SVG 图标 (内嵌) ----------
    const SVG_ICONS = {
        base: `<svg viewBox="0 0 100 100" class="part-icon"><defs><linearGradient id="grad-base-side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#334155"/><stop offset="0.5" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/></linearGradient></defs><path d="M20 60 v15 q0 10 30 10 q30 0 30 -10 v-15" fill="url(#grad-base-side)"/><ellipse cx="50" cy="60" rx="30" ry="10" fill="#475569"/><rect x="40" y="55" width="20" height="10" rx="2" fill="#1e293b"/></svg>`,
        stand: `<svg viewBox="0 0 100 100" class="part-icon"><defs><linearGradient id="grad-stand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/></linearGradient></defs><path d="M25 85 L40 50 L75 25" fill="none" stroke="url(#grad-stand)" stroke-width="12" stroke-linecap="round"/><circle cx="40" cy="50" r="6" fill="#334155" stroke="#fff" stroke-width="1"/></svg>`,
        bulb: `<svg viewBox="0 0 100 100" class="part-icon"><radialGradient id="grad-bulb"><stop offset="0%" stop-color="#fffeee"/><stop offset="80%" stop-color="#eab308" stop-opacity="0.3"/><stop offset="100%" stop-color="#ca8a04" stop-opacity="0.8"/></radialGradient><rect x="42" y="70" width="16" height="10" fill="#ca8a04"/><path d="M50 70 C50 70 75 55 75 35 A25 25 0 0 0 25 35 C25 55 50 70 50 70 Z" fill="url(#grad-bulb)"/><path d="M35 30 A10 10 0 0 1 45 25" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/></svg>`,
        shade_desk: `<svg viewBox="0 0 100 100" class="part-icon"><linearGradient id="grad-shade-blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0284c7"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/></linearGradient><path d="M25 75 L75 75 L65 30 L35 30 Z" fill="url(#grad-shade-blue)" stroke="#bae6fd" stroke-width="1"/><ellipse cx="50" cy="75" rx="25" ry="5" fill="#1e293b" opacity="0.3"/></svg>`,
        wire: `<svg viewBox="0 0 100 100" class="part-icon"><path d="M15 80 Q35 20 50 50 T85 20" fill="none" stroke="#60a5fa" stroke-width="6"/><path d="M80 10 h15 v20 h-15 z" fill="#1e293b"/><rect x="95" y="14" width="5" height="4" fill="#94a3b8"/><rect x="95" y="22" width="5" height="4" fill="#94a3b8"/></svg>`,
        switch_desk: `<svg viewBox="0 0 100 100" class="part-icon"><rect x="25" y="40" width="50" height="25" rx="5" fill="#334155" stroke="#64748b"/><circle cx="50" cy="52.5" r="8" fill="#ef4444" stroke="#991b1b" stroke-width="2"/></svg>`,
        power: `<svg viewBox="0 0 100 100" class="part-icon"><rect x="20" y="35" width="60" height="30" rx="2" fill="#334155" stroke="#94a3b8"/><circle cx="50" cy="50" r="6" fill="#38bdf8" filter="drop-shadow(0 0 5px #38bdf8)"/></svg>`,
        cord: `<svg viewBox="0 0 100 100" class="part-icon"><line x1="50" y1="10" x2="50" y2="90" stroke="#94a3b8" stroke-width="6"/><path d="M48 10 l4 10 M48 30 l4 10 M48 50 l4 10 M48 70 l4 10" stroke="#475569"/></svg>`,
        shade_pendant: `<svg viewBox="0 0 100 100" class="part-icon"><linearGradient id="grad-shade-orange" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ea580c"/><stop offset="0.5" stop-color="#f97316"/><stop offset="1" stop-color="#ea580c"/></linearGradient><path d="M10 65 L90 65 Q95 55 50 30 Q5 55 10 65 Z" fill="url(#grad-shade-orange)" stroke="#fdba74"/><rect x="40" y="20" width="20" height="20" fill="#334155"/></svg>`,
        switch_wall: `<svg viewBox="0 0 100 100" class="part-icon"><rect x="25" y="20" width="50" height="60" rx="3" fill="#e2e8f0" stroke="#94a3b8"/><rect x="35" y="35" width="30" height="30" fill="#cbd5e1"/><rect x="35" y="45" width="30" height="20" fill="#ef4444"/></svg>`
    };
    const PARTS_DB = [
        { id: 'base', name: '底座', icon: SVG_ICONS.base, target: ['desk'] },
        { id: 'power', name: '顶部灯座', icon: SVG_ICONS.power, target: ['pendant'] },
        { id: 'stand', name: '支架', icon: SVG_ICONS.stand, target: ['desk'] },
        { id: 'cord', name: '电线', icon: SVG_ICONS.cord, target: ['pendant'] },
        { id: 'shade_desk', name: '灯罩', icon: SVG_ICONS.shade_desk, target: ['desk'] },
        { id: 'shade_pendant', name: '灯罩', icon: SVG_ICONS.shade_pendant, target: ['pendant'] },
        { id: 'bulb', name: '灯泡', icon: SVG_ICONS.bulb, target: ['desk', 'pendant'] },
        { id: 'switch', name: '开关', icon: SVG_ICONS.switch_desk, target: ['desk'] },
        { id: 'switch_wall', name: '墙上开关', icon: SVG_ICONS.switch_wall, target: ['pendant'] },
        { id: 'wire', name: '插头', icon: SVG_ICONS.wire, target: ['desk'] }
    ];
    const SVG_MAP = {
        desk: { 'base':'svg-desk-base', 'stand':'svg-desk-stand', 'bulb':'svg-desk-bulb', 'shade_desk':'svg-desk-shade', 'wire':'svg-desk-wire', 'switch':'svg-desk-switch' },
        pendant: { 'power':'svg-pendant-power', 'cord':'svg-pendant-cord', 'bulb':'svg-pendant-bulb', 'shade_pendant':'svg-pendant-shade', 'switch_wall':'svg-pendant-switch' }
    };
    const REQUIRED_DESK = ['base','stand','bulb','shade_desk','wire','switch'];
    const REQUIRED_PENDANT = ['power','cord','bulb','shade_pendant','switch_wall'];

    let state = {
        desk: { parts: new Set(), on: false },
        pendant: { parts: new Set(), on: false },
        activeExperiment: null,
        completedExperiments: new Set(),
        dragged: null
    };

    function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    function renderInventory() { const grid = document.getElementById('parts-grid-content'); grid.innerHTML = ''; shuffleArray([...PARTS_DB]).forEach(part => { const card = document.createElement('div'); card.className = 'part-card'; card.draggable = true; card.innerHTML = `${part.icon}<div class="part-name">${part.name}</div>`; card.addEventListener('dragstart', (e) => { if (!state.activeExperiment) { e.preventDefault(); setStatus('请先点击“开始”按钮选择一个实验！', 'error'); return; } state.dragged = part; e.dataTransfer.effectAllowed = 'copy'; card.style.opacity = '0.5'; }); card.addEventListener('dragend', () => { state.dragged = null; card.style.opacity = '1'; document.querySelectorAll('.panel').forEach(p => p.classList.remove('drag-over')); }); grid.appendChild(card); }); }
    function renderProgressBar(zone, required) { const bar = document.getElementById(`progress-${zone}`); bar.innerHTML = ''; required.forEach(req => { const step = document.createElement('div'); step.className = 'progress-step'; step.id = `step-${zone}-${req}`; bar.appendChild(step); }); }
    function updateVisuals(zone) { const parts = state[zone].parts; Object.entries(SVG_MAP[zone]).forEach(([partId, svgId]) => { const el = document.getElementById(svgId); if (el) parts.has(partId) ? el.classList.add('visible') : el.classList.remove('visible'); }); if (zone === 'pendant') { const conduit = document.getElementById('svg-pendant-wire-conduit'); if (parts.has('power') || parts.has('switch_wall')) conduit.classList.add('visible'); } const hint = document.getElementById(`${zone}-hint`); if (zone === 'desk' && parts.has('base')) hint.style.display = 'none'; if (zone === 'pendant' && parts.has('power')) hint.style.display = 'none'; parts.forEach(pid => { const step = document.getElementById(`step-${zone}-${pid}`); if (step) step.classList.add('active'); }); }
    function setStatus(msg, type) { const el = document.getElementById('status-display'); el.textContent = msg; el.className = `status-display ${type}`; if (type !== 'normal') setTimeout(() => { if (!state.activeExperiment) el.textContent = '请选择一个实验开始！'; else el.textContent = '请拖动零件到工作台...'; el.className = 'status-display'; }, 4000); }
    function handleDragOver(e) { const zone = e.currentTarget.id.replace('zone-',''); if (state.activeExperiment !== 'BOTH' && state.activeExperiment !== zone) return; e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function handleDrop(e, zone) { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); const part = state.dragged; if (!part) return; if (state.activeExperiment !== 'BOTH' && state.activeExperiment !== zone) { setStatus('这个区域暂时锁定了，请专注于当前任务！', 'error'); return; } if (!part.target.includes(zone)) { setStatus('哎呀，这个零件不是这里的哦！', 'error'); return; } if (state[zone].parts.has(part.id)) { setStatus('这个零件已经装好了！', 'error'); return; } const rules = { desk: { 'stand': { req: 'base', hint: '请先安装底座' }, 'wire': { req: 'base', hint: '请先安装底座' }, 'bulb': { req: 'stand', hint: '请先安装支架' }, 'shade_desk': { req: 'stand', hint: '请先安装支架' } }, pendant: { 'cord': { req: 'power', hint: '请先安装顶部灯座' }, 'shade_pendant': { req: 'cord', hint: '请先安装电线' }, 'bulb': { req: 'cord', hint: '请先安装电线' }, 'switch_wall': { req: 'cord', hint: '请先安装好电线' } } }; const rule = rules[zone]?.[part.id]; if (rule && !state[zone].parts.has(rule.req)) { setStatus(rule.hint, 'error'); return; } state[zone].parts.add(part.id); updateVisuals(zone); const required = zone === 'desk' ? REQUIRED_DESK : REQUIRED_PENDANT; const isComplete = required.every(r => state[zone].parts.has(r)); setStatus(`装好了：${part.name}`, 'normal'); if (isComplete) setStatus(`太棒了！${zone === 'desk' ? '台灯' : '吊灯'}拼好了，快点击开关试试！`, 'success'); }
    function selectExperiment(zone) { if (state.activeExperiment && state.activeExperiment !== 'BOTH') return; state.activeExperiment = zone; document.getElementById(`overlay-${zone}`).classList.add('hidden'); const other = zone === 'desk' ? 'pendant' : 'desk'; if (!state.completedExperiments.has(other)) { const otherOverlay = document.getElementById(`overlay-${other}`); otherOverlay.classList.remove('hidden'); otherOverlay.innerHTML = `<svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><div class="locked-msg">请先完成另一个实验<br>点亮灯泡自动解锁</div>`; } setStatus(`已选择：制作${zone === 'desk' ? '台灯' : '吊灯'}，开始吧！`, 'normal'); }
    function autoUnlockOther(finishedZone) { state.completedExperiments.add(finishedZone); state.activeExperiment = 'BOTH'; const other = finishedZone === 'desk' ? 'pendant' : 'desk'; document.getElementById(`overlay-${other}`).classList.add('hidden'); }
    function handleSwitchClick(zone) { if (state.activeExperiment !== 'BOTH' && state.activeExperiment !== zone) return; const required = zone === 'desk' ? REQUIRED_DESK : REQUIRED_PENDANT; const isComplete = required.every(r => state[zone].parts.has(r)); if (!isComplete) { setStatus('零件还没找齐呢，再检查一下！', 'error'); return; } state[zone].on = !state[zone].on; const isOn = state[zone].on; const beam = document.getElementById(`${zone}-beam`); const bulb = document.getElementById(SVG_MAP[zone].bulb); const switchGroup = document.getElementById(SVG_MAP[zone][zone === 'desk' ? 'switch' : 'switch_wall']); if (isOn) { beam.classList.add('on'); bulb.classList.add('lit'); switchGroup.classList.add('switch-active'); if (!state.completedExperiments.has(zone)) { setStatus(`哇！亮起来了！挑战成功！另一个实验已自动解锁！`, 'success'); autoUnlockOther(zone); } else setStatus(`哇！${zone === 'desk' ? '台灯' : '吊灯'}亮起来了！`, 'success'); } else { beam.classList.remove('on'); bulb.classList.remove('lit'); switchGroup.classList.remove('switch-active'); setStatus(`${zone === 'desk' ? '台灯' : '吊灯'}关掉了。`, 'normal'); } }
    function resetWorkshop() { state.desk.parts.clear(); state.desk.on = false; state.pendant.parts.clear(); state.pendant.on = false; state.activeExperiment = null; state.completedExperiments.clear(); document.querySelectorAll('.svg-part').forEach(el => el.classList.remove('visible')); document.querySelectorAll('.light-beam').forEach(el => el.classList.remove('on')); document.querySelectorAll('.lit').forEach(el => el.classList.remove('lit')); document.querySelectorAll('.progress-step').forEach(el => el.classList.remove('active')); document.querySelectorAll('.switch-active').forEach(el => el.classList.remove('switch-active')); document.getElementById('desk-hint').style.display = 'block'; document.getElementById('pendant-hint').style.display = 'block'; const overlayDesk = document.getElementById('overlay-desk'); overlayDesk.classList.remove('hidden'); overlayDesk.innerHTML = `<button class="btn-start" onclick="selectExperiment('desk')">开始制作台灯</button>`; const overlayPendant = document.getElementById('overlay-pendant'); overlayPendant.classList.remove('hidden'); overlayPendant.innerHTML = `<button class="btn-start" onclick="selectExperiment('pendant')">开始制作吊灯</button>`; renderInventory(); setStatus('全部重置啦，请重新选择实验！', 'normal'); }
    function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
    window.onload = () => { renderInventory(); renderProgressBar('desk', REQUIRED_DESK); renderProgressBar('pendant', REQUIRED_PENDANT); };
</script>
</body>
</html>
